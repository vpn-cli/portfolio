<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22252B"/>
      <stop offset="50%" stop-color="#16181D"/>
      <stop offset="100%" stop-color="#0E0F12"/>
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C445E"/>
      <stop offset="100%" stop-color="#1A2938"/>
    </linearGradient>
  </defs>

  <!-- Studio / Outdoor Atmosphere -->
  <rect width="400" height="400" fill="url(#avatarBg)"/>

  <!-- Distant mountain / tree silhouettes -->
  <path d="M0 240 Q100 180 200 220 T400 190 L400 400 L0 400 Z" fill="#131418" opacity="0.8"/>
  <path d="M0 270 Q120 230 250 250 T400 240 L400 400 L0 400 Z" fill="#101114" opacity="0.9"/>

  <!-- Portrait Silhouette -->
  <g transform="translate(100, 100)">
    <!-- Head / Hair -->
    <circle cx="100" cy="70" r="44" fill="#363842"/>
    <!-- Face Outline -->
    <ellipse cx="100" cy="80" rx="34" ry="40" fill="#E6C8B0"/>
    <!-- Hair detail -->
    <path d="M66 70 Q100 30 134 70 Q140 50 120 40 Q100 36 80 44 Z" fill="#2B2622"/>
    <!-- Warm smile & features -->
    <circle cx="88" cy="78" r="3" fill="#3D322A"/>
    <circle cx="112" cy="78" r="3" fill="#3D322A"/>
    <path d="M92 98 Q100 108 108 98" fill="none" stroke="#5C4535" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Blue Jacket / Outdoor Attire -->
    <path d="M40 140 Q100 120 160 140 L190 280 L10 280 Z" fill="url(#jacketGrad)"/>
    <!-- Collar -->
    <path d="M80 130 L100 160 L120 130" fill="#151E28"/>
    <path d="M70 130 Q100 145 130 130" fill="none" stroke="#48627E" stroke-width="3"/>
  </g>
</svg>
