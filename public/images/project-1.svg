<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18191D"/>
      <stop offset="50%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#0B0B0D"/>
    </linearGradient>
    <linearGradient id="pedestalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C2D33"/>
      <stop offset="100%" stop-color="#151619"/>
    </linearGradient>
    <linearGradient id="phoneBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3B42"/>
      <stop offset="50%" stop-color="#202126"/>
      <stop offset="100%" stop-color="#101114"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="25" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="600" height="800" fill="url(#bgGrad1)"/>

  <!-- Architectural Concrete Pedestal -->
  <polygon points="120,480 480,440 520,720 80,760" fill="url(#pedestalGrad)" opacity="0.9"/>
  <polygon points="120,480 480,440 440,420 160,450" fill="#3D3F47" opacity="0.6"/>

  <!-- Smartphone Resting at an Angle with Drop Shadow -->
  <g transform="translate(190, 180) rotate(-4)" filter="url(#shadow1)">
    <!-- Phone Chassis Outer Frame -->
    <rect x="0" y="0" width="220" height="440" rx="42" fill="url(#phoneBezel)" stroke="#4A4B54" stroke-width="2"/>
    <!-- Phone Inner Screen -->
    <rect x="10" y="10" width="200" height="420" rx="34" fill="#0D0E11"/>
    
    <!-- Dynamic Island -->
    <rect x="68" y="20" width="64" height="18" rx="9" fill="#000000"/>
    <circle cx="118" cy="29" r="3.5" fill="#1C2833"/>

    <!-- Financial UI Elements on Screen -->
    <text x="24" y="70" font-family="system-ui, sans-serif" font-size="9" fill="#6B6E7B" font-weight="600" letter-spacing="1">TOTAL BALANCE</text>
    <text x="24" y="96" font-family="system-ui, sans-serif" font-size="20" fill="#FFFFFF" font-weight="700">$18,450.00</text>

    <!-- Expense Card -->
    <rect x="20" y="118" width="160" height="74" rx="14" fill="#18191E" stroke="#282930" stroke-width="1"/>
    <text x="32" y="142" font-family="system-ui, sans-serif" font-size="10" fill="#9DA0AE">Monthly Spending</text>
    <!-- Bar Graph -->
    <rect x="32" y="156" width="12" height="24" rx="2" fill="#3A3C46"/>
    <rect x="52" y="150" width="12" height="30" rx="2" fill="#585B68"/>
    <rect x="72" y="162" width="12" height="18" rx="2" fill="#3A3C46"/>
    <rect x="92" y="144" width="12" height="36" rx="2" fill="#EEEEEE"/>
    <rect x="112" y="152" width="12" height="28" rx="2" fill="#585B68"/>
    <rect x="132" y="160" width="12" height="20" rx="2" fill="#3A3C46"/>

    <!-- Recent Transactions -->
    <rect x="20" y="204" width="160" height="38" rx="12" fill="#15161B"/>
    <circle cx="36" cy="223" r="8" fill="#24262E"/>
    <text x="52" y="222" font-family="system-ui, sans-serif" font-size="10" fill="#D2D4DF">Cloud Servers</text>
    <text x="52" y="233" font-family="system-ui, sans-serif" font-size="8" fill="#6B6E7B">Today, 14:20</text>
    <text x="146" y="226" font-family="system-ui, sans-serif" font-size="10" fill="#FFFFFF" font-weight="600">-$34</text>

    <rect x="20" y="248" width="160" height="38" rx="12" fill="#15161B"/>
    <circle cx="36" cy="267" r="8" fill="#24262E"/>
    <text x="52" y="266" font-family="system-ui, sans-serif" font-size="10" fill="#D2D4DF">Stripe Payout</text>
    <text x="52" y="277" font-family="system-ui, sans-serif" font-size="8" fill="#6B6E7B">Yesterday</text>
    <text x="136" y="270" font-family="system-ui, sans-serif" font-size="10" fill="#EEEEEE" font-weight="600">+$1,280</text>
  </g>
</svg>
