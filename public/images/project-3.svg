<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="laptopBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1816"/>
      <stop offset="60%" stop-color="#121110"/>
      <stop offset="100%" stop-color="#090807"/>
    </linearGradient>
    <pattern id="tablePattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 0 L40 40 M40 0 L0 40" stroke="#25221E" stroke-width="0.8"/>
    </pattern>
    <filter id="laptopShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="40" stdDeviation="35" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="900" height="500" fill="url(#laptopBg)"/>
  <rect width="900" height="500" fill="url(#tablePattern)" opacity="0.4"/>
  <!-- Warm sunlight cast across surface -->
  <polygon points="200,0 600,0 750,500 0,500" fill="#FFF3E0" opacity="0.04"/>

  <!-- MacBook Model -->
  <g transform="translate(180, 50)" filter="url(#laptopShadow)">
    <!-- Screen Bezel -->
    <rect x="0" y="0" width="540" height="340" rx="16" fill="#1C1D21" stroke="#33343A" stroke-width="2"/>
    <!-- Screen Display Area -->
    <rect x="12" y="12" width="516" height="316" rx="8" fill="#0C0D10"/>

    <!-- Screen Notch & Camera -->
    <rect x="238" y="12" width="64" height="12" rx="4" fill="#1C1D21"/>
    <circle cx="270" cy="18" r="2.5" fill="#0A1828"/>

    <!-- Dashboard UI on Laptop Display -->
    <g transform="translate(26, 32)">
      <!-- Top Bar -->
      <circle cx="6" cy="6" r="3.5" fill="#ED6A5E"/>
      <circle cx="18" cy="6" r="3.5" fill="#F4BF4F"/>
      <circle cx="30" cy="6" r="3.5" fill="#61C554"/>
      <text x="50" y="9" font-family="system-ui, sans-serif" font-size="9" fill="#5A5C66">nexus-devflow.internal/clusters</text>

      <!-- Dashboard Grid -->
      <g transform="translate(0, 20)">
        <!-- Metric Card 1 -->
        <rect x="0" y="0" width="146" height="52" rx="8" fill="#14151A" stroke="#22232A"/>
        <text x="12" y="18" font-family="system-ui, sans-serif" font-size="8" fill="#757885">UPTIME</text>
        <text x="12" y="38" font-family="system-ui, sans-serif" font-size="14" fill="#EEEEEE" font-weight="700">99.99%</text>

        <!-- Metric Card 2 -->
        <rect x="156" y="0" width="146" height="52" rx="8" fill="#14151A" stroke="#22232A"/>
        <text x="168" y="18" font-family="system-ui, sans-serif" font-size="8" fill="#757885">ACTIVE NODES</text>
        <text x="168" y="38" font-family="system-ui, sans-serif" font-size="14" fill="#EEEEEE" font-weight="700">64 / 64</text>

        <!-- Metric Card 3 -->
        <rect x="312" y="0" width="156" height="52" rx="8" fill="#14151A" stroke="#22232A"/>
        <text x="324" y="18" font-family="system-ui, sans-serif" font-size="8" fill="#757885">GLOBAL LATENCY</text>
        <text x="324" y="38" font-family="system-ui, sans-serif" font-size="14" fill="#EEEEEE" font-weight="700">12ms</text>
      </g>

      <!-- Main Graph Panel -->
      <g transform="translate(0, 84)">
        <rect x="0" y="0" width="468" height="150" rx="10" fill="#131418" stroke="#202128"/>
        <text x="14" y="24" font-family="system-ui, sans-serif" font-size="10" fill="#EEEEEE" font-weight="600">Real-Time Cluster Telemetry</text>
        
        <!-- Smooth Chart Curve -->
        <path d="M 20 120 Q 90 40 160 90 T 300 60 T 440 30" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9"/>
        <path d="M 20 120 Q 90 40 160 90 T 300 60 T 440 30 L 440 135 L 20 135 Z" fill="#FFFFFF" opacity="0.05"/>
        
        <!-- Grid horizontal lines -->
        <line x1="20" y1="50" x2="440" y2="50" stroke="#22232C" stroke-width="1"/>
        <line x1="20" y1="90" x2="440" y2="90" stroke="#22232C" stroke-width="1"/>
        <line x1="20" y1="130" x2="440" y2="130" stroke="#22232C" stroke-width="1"/>
      </g>
    </g>

    <!-- Aluminum Base Chasis -->
    <path d="M-40 340 L580 340 L550 354 L-10 354 Z" fill="#2E3038" stroke="#444650" stroke-width="1"/>
    <!-- Center Thumb Notch on Base -->
    <rect x="235" y="340" width="70" height="5" rx="2" fill="#1A1B20"/>
  </g>
</svg>
